name: FreeBSD OCI Images

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  schedule:
    # Weekly, Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Space-separated images to build (e.g., nginx node24); empty builds all'
        required: false
        type: string
  workflow_call:
    inputs:
      image_name:
        description: 'Space-separated images to build (e.g., nginx node24); empty builds all'
        required: false
        type: string

concurrency:
  group: oci-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_tool_cache: true
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox mono-complete"
          remove_packages_one_command: true
          rm_cmd: rmz

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: build oci image
        uses: vmactions/freebsd-vm@v1.4.6
        env:
          AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          REGISTRY: ghcr.io
          OS_VER: 16.0-CURRENT
          IMAGE: ${{ inputs.image_name }}
        with:
          usesh: true
          #debug-on-error: true
          #vnc-password: ${{ secrets.VNC_PASSWORD }}
          envs: "AUTH_TOKEN USERNAME REGISTRY OS_VER IMAGE"
          prepare: |
            pkg install -y podman-suite
            echo "${AUTH_TOKEN}" | buildah login ${REGISTRY} -u "${USERNAME}" --password-stdin
          run: |
            if [ -n "${IMAGE}" ]; then
              ./make.sh -d -m "${IMAGE}"
            else
              ./make.sh -d
            fi
