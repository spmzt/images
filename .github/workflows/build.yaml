name: FreeBSD OCI Images

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  schedule:
    # Weekly, Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Space-separated images to build (e.g., nginx node24); empty builds all'
        required: false
        type: string
  workflow_call:
    inputs:
      image_name:
        description: 'Space-separated images to build (e.g., nginx node24); empty builds all'
        required: false
        type: string

concurrency:
  group: oci-images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      images: ${{ steps.plan.outputs.images }}
      day: ${{ steps.plan.outputs.day }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select images to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_IMAGES: ${{ inputs.image_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all=$(find . -mindepth 2 -maxdepth 2 -name Containerfile \
              ! -path './baseutils/*' | cut -d/ -f2 | sort)

          if [ -n "${INPUT_IMAGES}" ]; then
            base=false
            images=""
            for img in ${INPUT_IMAGES}; do
              if [ ! -f "${img}/Containerfile" ]; then
                echo "::error::Unknown image: ${img}"
                exit 1
              fi
              if [ "${img}" = baseutils ]; then
                base=true
              else
                images="${images} ${img}"
              fi
            done
          elif [ "${EVENT}" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BEFORE}" "${AFTER}")
            echo "Changed files:"
            echo "${changed}"
            if echo "${changed}" | grep -qE '^(make\.sh|\.github/|baseutils/)'; then
              base=true
              images=${all}
            else
              base=false
              images=$(echo "${changed}" | grep / | cut -d/ -f1 | sort -u |
                  while read -r dir; do
                    [ -f "${dir}/Containerfile" ] && echo "${dir}"
                  done || true)
            fi
          else
            # Schedule, manual run without input, or a push we can't diff
            base=true
            images=${all}
          fi

          images=$(printf '%s\n' ${images} | jq -R . | jq -sc 'map(select(length > 0))')
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "day=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "Build baseutils: ${base}"
          echo "Build images: ${images}"

  baseutils:
    needs: plan
    if: needs.plan.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build base and baseutils
        uses: ./.github/actions/freebsd-build
        with:
          args: -d -m baseutils
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-name: baseutils
          cache-day: ${{ needs.plan.outputs.day }}

  image:
    name: ${{ matrix.image }}
    needs: [ plan, baseutils ]
    # Run even when baseutils was skipped, but not when it failed
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.images != '[]' &&
      needs.baseutils.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.image }}
        uses: ./.github/actions/freebsd-build
        with:
          args: -B -m ${{ matrix.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-name: ${{ matrix.image }}
          cache-day: ${{ needs.plan.outputs.day }}
